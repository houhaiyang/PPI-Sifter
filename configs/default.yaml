# ============================================================
# PPI-Sifter 默认配置
# 所有训练/评估/推理脚本均直接读取本文件，无命令行传参
# ============================================================

# ── 全局 ──
project:
  name: ppi_sifter
  seed: 42

device: cuda          # cuda | cpu

# ── 数据路径 ──
data:
  hdf5_path:   data/BIOGRID/embeddings/embeddings.h5
  splits_dir:  data/BIOGRID/pairs/protein_disjoint
  split_mode:  proteindisjoint
  max_seq_len: 512        # 1024->512：attention 计算量降 4x（O(L²)）
  num_workers: 8          # Linux 多进程 I/O，A100 推荐 8
  prefetch_factor: 4      # 每个 worker 预取 4 个 batch
  cache_size: 8192        # LRU 内存缓存蛋白数量（按需调低，防 OOM）

# ── 输出路径 ──
paths:
  checkpoint_dir: outputs/checkpoints
  log_dir:        outputs/logs
  pred_dir:       outputs/preds
  interpret_dir:  outputs/interpret

# ── 模型超参 ──
model:
  d_in:          1152
  d_model:       256
  n_heads:       8
  n_layers:      2
  ffn_expansion: 4
  dropout:       0.1
  attn_dropout:  0.1
  topk_default:  20

# ── 训练超参 ──
train:
  epochs:         2
  batch_size:     256       # A100 建议 64；若 OOM 降到 32
  lr:             1.0e-4
  weight_decay:   1.0e-4
  grad_clip:      1.0
  warmup_epochs:  1
  scheduler:      cosine
  val_interval:   1
  # 损失权重
  pos_weight:     2.0
  focal_alpha:    0.9
  focal_gamma:    2.0
  lambda_focal:   0.5
  lambda_sparse:  0.01
  lambda_sym:     0.01
  # Early stopping
  early_stop_patience: 8
  early_stop_metric: auprc
  # 断点续训
  resume_checkpoint: ""
  # 混合精度
  fp16: true              # A100 开启，速度 ~2x
  # gradient accumulation（等效 batch_size * accum_steps）
  grad_accum_steps: 4     # 如需等效 batch *2，设为 2

# ── 推理 / 评估 ──
infer:
  batch_size:         64
  topk:               20
  topk_residue_pairs: 20
  split:              test
  checkpoint:         ""
  threshold:          0.5
  export_attn:        false