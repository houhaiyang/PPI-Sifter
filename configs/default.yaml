# ============================================================
# PPI-Sifter 默认配置（基准值）
# 所有子配置（train.yaml / eval.yaml）通过 default_config 继承本文件
# 修改此文件会影响所有实验，实验级覆盖请在子配置中进行
# ============================================================

seed: 42
device: cuda          # cuda | cpu
num_workers: 0        # Win11 本地 debug 推荐 0；Linux A100 推荐 4

# ── 数据路径 ──
paths:
  # embedding 来源：目录（batch*.npz）或单个 .pt 文件，二选一
  emb_dir: data/BIOGRID/embeddings/residue    # batch*.npz 目录（优先）
  emb_pt: ""                                  # 留空则使用 emb_dir；填路径则用 .pt
  # split CSV 根目录，子目录名 = split_mode
  split_dir: data/BIOGRID/pairs
  split_mode: proteindisjoint                 # random | proteindisjoint | clusterdisjoint | speciesdisjoint
  # 输出目录
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  pred_dir: outputs/preds
  interpret_dir: outputs/interpret

# ── 模型超参 ──
model:
  input_dim: 1152       # ESM-C 600M residue embedding 维度（esmc_300m=960）
  proj_dim: 256
  num_heads: 2
  dropout: 0.25
  attn_dropout: 0.1
  ffn_hidden: 512       # 省显存版；A100 全量训练可改 2048
  cls_hidden: [256, 64]
  score_temperature: 1.0
  topk_default: 20

# ── 训练超参 ──
train:
  epochs: 50
  batch_size: 8        # RTX4070S debug 建议 8；A100 建议 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  warmup_epochs: 2
  scheduler: cosine     # cosine | none
  max_seq_len: 1024     # residue 最大长度，超长截断
  # 损失权重
  pos_weight: 2.0       # weighted BCE 正样本权重
  focal_alpha: 0.9
  focal_gamma: 2.0
  lambda_focal: 0.5
  lambda_sparse: 0.01
  lambda_sym: 0.01
  # Early stopping
  early_stop_patience: 8
  early_stop_metric: auprc
  # 混合精度（默认关，A100 开启可加速）
  fp16: false

# ── 推理 / 评估 ──
infer:
  batch_size: 32
  topk: 20
  split: test           # 评估哪个 split（train | valid | test）
  checkpoint: ""        # 评估时指定的 checkpoint 路径（留空则自动找 best.pt）

