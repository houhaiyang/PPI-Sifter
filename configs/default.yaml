seed: 42
device: cuda
num_workers: 0

paths:
  embeddings_pt: data/BIOGRID/embeddings/all_residue_embeddings.pt
  train_csv: data/BIOGRID/pairs/train.csv
  valid_csv: data/BIOGRID/pairs/valid.csv
  test_csv: data/BIOGRID/pairs/test.csv
  checkpoint_dir: outputs/checkpoints
  pred_dir: outputs/preds
  interpret_dir: outputs/interpret

model:
  input_dim: 1152
  proj_dim: 256
  num_heads: 2
  dropout: 0.25
  attn_dropout: 0.1
  ffn_hidden: 4096
  cls_hidden: [256, 64]
  score_temperature: 1.0
  topk_default: 20

train:
  batch_size: 16
  epochs: 10
  lr: 5.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  pos_weight: 5.0
  focal_alpha: 0.9
  focal_gamma: 2.0
  lambda_focal: 1.0
  lambda_sparse: 1.0e-4
  lambda_sym: 1.0e-2
  early_stop_patience: 3

infer:
  batch_size: 8
  topk: 20
